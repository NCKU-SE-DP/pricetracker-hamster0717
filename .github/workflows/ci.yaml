name: CI Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'fix/integration-test' # 新增這一行
      - 'refactor/crawler-oop-implementation'
      - 'refactor/llm_client'
      - 'refactor/error_handling'
  pull_request:
    branches:
      - 'main'
      - 'develop'

jobs:
  test:
    runs-on: [F74134736]
    steps:
      - name: Check OPENAI_API_KEY Length
        shell: powershell
        run: |
          if (-not $env:OPENAI_API_KEY) {
            Write-Host "OPENAI_API_KEY is not set or is empty!"
            exit 1
          } else {
            Write-Host "OPENAI_API_KEY length: $($env:OPENAI_API_KEY.Length)"
          }
        env:
          OPENAI_API_KEY: 123

      - name: Clear and Set Permissions for Temp Folder
        run: |
          Remove-Item -Recurse -Force "${{ runner.temp }}\*"
          icacls "${{ runner.temp }}" /grant Everyone:F /T
        shell: powershell

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-mock pytest-cov

      - name: Run integration tests (with mock DB)
        run: |
          cd backend
          pytest tests/integration --cov=src --cov-report=xml --disable-warnings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run unit tests
        run: |
          cd backend
          pytest tests/uni --cov=src --cov-report=xml --disable-warnings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}


      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage.xml

